<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Slider Navigation</title>
  <meta name="description" content="A tab bar that sticks to the top of the page, smooth-scrolls to each section and slides an indicator under the active tab.">
  <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>

  <!-- Hero -->
  <section class="et-hero-tabs">
    <h1>STICKY SLIDER NAV</h1>
    <p class="et-subtitle">Sliding content with sticky tab nav</p>
    <nav class="et-hero-tabs-container" aria-label="Sections">
      <a class="et-hero-tab" href="#tab-es6">ES6</a>
      <a class="et-hero-tab" href="#tab-flexbox">Flexbox</a>
      <a class="et-hero-tab" href="#tab-react">React</a>
      <a class="et-hero-tab" href="#tab-angular">Angular</a>
      <a class="et-hero-tab" href="#tab-other">Other</a>
      <span class="et-hero-tab-slider" aria-hidden="true"></span>
    </nav>
  </section>

  <!-- Main -->
  <main class="et-main">
    <section class="et-slide" id="tab-es6">
      <h2>ES6</h2>
      <p class="et-subtitle">Something about ES6</p>
    </section>
    <section class="et-slide" id="tab-flexbox">
      <h2>Flexbox</h2>
      <p class="et-subtitle">Something about Flexbox</p>
    </section>
    <section class="et-slide" id="tab-react">
      <h2>React</h2>
      <p class="et-subtitle">Something about React</p>
    </section>
    <section class="et-slide" id="tab-angular">
      <h2>Angular</h2>
      <p class="et-subtitle">Something about Angular</p>
    </section>
    <section class="et-slide" id="tab-other">
      <h2>Other</h2>
      <p class="et-subtitle">Something about Other</p>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="assets/scripts/script.js"></script>
</body>
</html>
